name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension files
        shell: pwsh
        run: |
          Get-ChildItem extension\*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { exit 1 }
          }
          python -m json.tool extension\manifest.json > $null
          python -m json.tool native-host\com.ytdlp_right_click.native_host.template.json > $null

      - name: Run extension unit tests
        run: node --test tests/shared.test.mjs

      - name: Check Rust formatting
        working-directory: native-host
        run: cargo fmt --check

      - name: Run Rust clippy
        working-directory: native-host
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: native-host
        run: cargo test --all-targets --all-features
